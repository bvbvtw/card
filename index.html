<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>給你的互動週年卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #6b4a52;
    --ink-soft: #9a7680;
    --cream: #fff7f1;
    --pink: #ef8fb2;
    --pink-d: #d65d86;
    --far-tile: 320px;
    --tree-tile: 256px;
    --ground-tile: 192px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: #f3d9e4;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .pixel-font { font-family: 'Press Start 2P', monospace; }

  /* ---- stage: a phone-shaped window, full-bleed on mobile ---- */
  .stage {
    position: relative;
    width: 100%; height: 100%;
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
    background: #fff0f5;
    box-shadow: 0 0 60px rgba(180, 90, 130, 0.25);
    image-rendering: pixelated;
  }

  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #ffe3ee 0%, #fff4f8 100%);
    transition: background 1.4s ease;
  }

  /* parallax scenery layers */
  .layer-far, .layer-trees, .layer-ground {
    position: absolute; left: 0; width: 100%;
    background-repeat: repeat-x;
    image-rendering: pixelated;
    pointer-events: none;
  }
  .layer-far   { bottom: 22%; height: 160px; opacity: 0.85; background-position: bottom left; }
  .layer-trees { bottom: 18%; height: 240px; background-position: bottom left; }
  .layer-ground{ bottom: 0;   height: 24%;  background-position: top left; }

  .stage.walking .layer-far   { animation: scrollFar 4.5s linear infinite; }
  .stage.walking .layer-trees { animation: scrollTrees 1.7s linear infinite; }
  .stage.walking .layer-ground{ animation: scrollGround 0.9s linear infinite; }
  @keyframes scrollFar    { from { background-position-x: 0; } to { background-position-x: calc(var(--far-tile) * -1); } }
  @keyframes scrollTrees  { from { background-position-x: 0; } to { background-position-x: calc(var(--tree-tile) * -1); } }
  @keyframes scrollGround { from { background-position-x: 0; } to { background-position-x: calc(var(--ground-tile) * -1); } }

  /* the girl */
  .girl-wrap {
    position: absolute;
    bottom: 18%;
    left: 32%;
    transform: translateX(-50%);
    z-index: 6;
    cursor: pointer;
    filter: drop-shadow(0 6px 0 rgba(170, 110, 140, 0.18));
  }
  .girl-canvas { display: block; image-rendering: pixelated; }
  .girl-wrap::after {
    content: ''; position: absolute;
    left: 50%; bottom: -6px; transform: translateX(-50%);
    width: 70%; height: 10px; border-radius: 50%;
    background: rgba(150, 90, 120, 0.18);
    z-index: -1;
  }
  .girl-wrap.bobbing { animation: bob 0.32s steps(2) infinite; }
  @keyframes bob { 0% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-5px); } }

  /* petals */
  .petals { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute; top: -20px;
    border-radius: 60% 0 60% 0;
    opacity: 0.9;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: 1, infinite;
  }
  @keyframes fall {
    from { transform: translateY(-20px) translateX(0) rotate(0deg); }
    to   { transform: translateY(108vh) translateX(var(--drift)) rotate(540deg); }
  }
  @keyframes sway { 0%,100% { margin-left: -6px; } 50% { margin-left: 6px; } }

  /* ---- top bar ---- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 8;
    padding: 16px 18px 10px;
    display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .title {
    font-size: 13px; letter-spacing: 1px;
    color: var(--pink-d);
    background: rgba(255, 250, 245, 0.82);
    padding: 7px 14px; border-radius: 999px;
    box-shadow: 0 2px 0 rgba(214, 93, 134, 0.25);
  }
  .hearts { display: flex; gap: 7px; }
  .heart {
    width: 16px; height: 16px;
    background: rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 0 2px rgba(214, 93, 134, 0.35);
    clip-path: path('M8 14 L1 6.5 A3.6 3.6 0 0 1 8 3 A3.6 3.6 0 0 1 15 6.5 Z');
    transition: transform 0.3s ease;
  }
  .heart.on { background: var(--pink-d); box-shadow: 0 0 0 2px rgba(214, 93, 134, 0.5); transform: scale(1.15); }

  /* ---- forward button ---- */
  .forward {
    position: absolute; bottom: calc(24% + 14px); left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    font-weight: 700; font-size: 15px;
    color: #fff;
    background: var(--pink-d);
    border: none; border-radius: 999px;
    padding: 12px 22px;
    box-shadow: 0 4px 0 #b94872, 0 6px 14px rgba(180, 80, 120, 0.3);
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .forward:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #b94872; }
  .forward.hide { display: none; }
  .forward.pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 4px 0 #b94872, 0 6px 14px rgba(180,80,120,0.3); } 50% { box-shadow: 0 4px 0 #b94872, 0 0 0 8px rgba(239,143,178,0.25), 0 6px 14px rgba(180,80,120,0.3); } }

  /* ---- checkpoint panel (bottom sheet) ---- */
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
    display: none; justify-content: center;
    padding: 0 16px 18px;
  }
  .panel.show { display: flex; }
  .panel.show .panel-card { animation: sheetUp 0.45s cubic-bezier(.2,.9,.3,1.15) both; }
  @keyframes sheetUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .panel-card {
    width: 100%; max-width: 440px;
    background: var(--cream);
    border-radius: 18px 18px 0 0;
    border: 3px solid var(--pink);
    border-bottom: none;
    padding: 16px 18px 20px;
    box-shadow: 0 -10px 30px rgba(180, 90, 130, 0.22);
    text-align: center;
  }
  .panel-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px; color: var(--pink-d);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  image-slot.panel-photo {
    display: block; width: 100%; height: 170px;
    margin: 0 auto 14px;
    border: 2px dashed var(--pink);
    border-radius: 12px; overflow: hidden;
  }
  .panel-msg {
    font-size: 17px; line-height: 1.7; font-weight: 500;
    color: var(--ink); text-wrap: pretty;
  }
  .panel-sign { margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
  img.panel-photo {
    display: block; width: 100%; height: 500px;
    margin: 0 auto 14px;
    border: 2px dashed var(--pink);
    border-radius: 12px;
    object-fit: cover;
  }
  img.finale-photo {
    display: block; width: 78%; height: 280px; margin: 0 auto 16px;
    border: 3px solid var(--pink); border-radius: 14px;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(180,90,130,0.25);
  }
  .panel-next {
    margin-top: 16px;
    font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    font-weight: 700; font-size: 14px; color: #fff;
    background: var(--pink); border: none; border-radius: 999px;
    padding: 11px 20px; cursor: pointer;
    box-shadow: 0 3px 0 var(--pink-d);
  }
  .panel-next:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--pink-d); }

  /* ---- finale ---- */
  .finale {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: radial-gradient(120% 90% at 50% 30%, rgba(255,240,247,0.9), rgba(255,225,238,0.96));
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .finale.show { opacity: 1; pointer-events: auto; }
  .finale-card {
    width: 100%; max-width: 420px; text-align: center;
    animation: rise 0.7s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .finale-sub { font-size: 16px; color: var(--ink-soft); margin-bottom: 6px; }
  .finale-title {
    font-size: 30px; font-weight: 700; color: var(--pink-d);
    letter-spacing: 1px; margin-bottom: 16px; text-wrap: balance;
  }
  image-slot.finale-photo {
    display: block; width: 78%; height: 200px; margin: 0 auto 16px;
    border: 3px solid var(--pink); border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 20px rgba(180,90,130,0.25);
  }
  .finale-msg { font-size: 17px; line-height: 1.8; color: var(--ink); margin-bottom: 14px; }
  .finale-sign { font-size: 14px; color: var(--ink-soft); margin-bottom: 18px; }
  .finale-heart {
    font-size: 26px; color: #fff; line-height: 1;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--pink-d); border: none; cursor: pointer;
    box-shadow: 0 5px 0 #b94872, 0 8px 18px rgba(180,80,120,0.35);
    animation: heartbeat 1.3s ease-in-out infinite;
  }
  .finale-heart:active { transform: translateY(3px); box-shadow: 0 2px 0 #b94872; }
  @keyframes heartbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }

  .fly-heart {
    position: fixed; z-index: 40; color: var(--pink-d);
    pointer-events: none; transform: translate(-50%, -50%);
    animation: fly 1.3s ease-out forwards;
  }
  @keyframes fly {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="stage" data-screen-label="互動週年卡片">
    <div class="sky"></div>
    <div class="layer-far"></div>
    <div class="layer-trees"></div>
    <div class="layer-ground"></div>
    <div class="scene"></div>
    <div class="girl-wrap"></div>
    <div class="petals"></div>

    <div class="topbar">
      <div class="title">給我最愛的波</div>
      <div class="hearts"></div>
    </div>

    <button class="forward">往前走 <span aria-hidden="true">→</span></button>

    <div class="panel"></div>
    <div class="finale"></div>
  </div>
